[workspace]
resolver = "3"
members = [
  "crates/ferry-sync",
  "crates/ferry-engine",
  "crates/ferry-vdir",
  "crates/ferry-pim-feed",
  "crates/ferry-pim-mirror",
  "crates/ferry-sync-service",
  "crates/ferry-bus",
  "crates/ferry-drive",
  "crates/ferry-drive-fuse",
  "crates/ferry-mountd",
  "crates/ferry-fake-graph",
  "crates/ferry-rig",
  "crates/storage-webdav",
  "crates/storage-graph",
  "crates/storage-gdrive",
  "crates/quickxorhash",
  "crates/syncd",
  "crates/syncd-fakes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/ferry"
publish = false

[workspace.dependencies]
ferry-sync      = { path = "crates/ferry-sync" }
ferry-engine    = { path = "crates/ferry-engine" }
ferry-vdir      = { path = "crates/ferry-vdir" }
ferry-pim-feed  = { path = "crates/ferry-pim-feed" }
ferry-pim-mirror = { path = "crates/ferry-pim-mirror" }
ferry-sync-service = { path = "crates/ferry-sync-service" }
ferry-bus       = { path = "crates/ferry-bus" }
ferry-drive     = { path = "crates/ferry-drive" }
ferry-drive-fuse = { path = "crates/ferry-drive-fuse" }
ferry-mountd    = { path = "crates/ferry-mountd" }
ferry-fake-graph = { path = "crates/ferry-fake-graph" }
storage-webdav  = { path = "crates/storage-webdav" }
storage-graph   = { path = "crates/storage-graph" }
storage-gdrive  = { path = "crates/storage-gdrive" }
quickxorhash    = { path = "crates/quickxorhash" }
syncd           = { path = "crates/syncd" }
syncd-fakes     = { path = "crates/syncd-fakes" }

# porter's crates, by git at the rev ferry is built against (as mailo and steward take them).
# The rev is a commit of porter's branch step7-ferry (the one that has left the sync crates); it
# is moved to the landed commit when that is on master, and Cargo.lock is made with it.
porter-ids = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-capability = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-core = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-wire = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-match = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-sheet = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-fs = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-provider = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-secrets = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-service-core = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-service-accounts = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-service = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-store = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-sheets = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-callers = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-dbus = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-dbus-macros = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-client = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-client-dbus = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-client-inproc = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-families = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-family-oauth = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-daemon = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709", default-features = false }
porter-http = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-http-reqwest = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-http-relay = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
dav-proto = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
test-kit = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-fake = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-fake-servers = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-rig = { git = "https://github.com/PoHsuanLai/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }

# quire's live settings modules (`org.quire.SettingsModule1`), for syncd: the Settings rows it
# serves. By git at the rev porter pins.
ds-settings     = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767", features = ["live", "tokio"] }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines ferry
# names itself, as porter does.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
toml = "1"
base64 = "0.22"
sha2 = "0.10"
# The RustCrypto hasher traits quickxorhash implements, at the line sha2 and md-5 already bring.
digest = "0.10"
md-5 = "0.10"
# Lower-case hex of a digest or a byte string (MIT OR Apache-2.0).
hex = "0.4"
clap = { version = "4", features = ["derive"] }
# Scratch directories that remove themselves when dropped (MIT OR Apache-2.0).
tempfile = "3"
# ferry-drive's cached byte ranges (MIT OR Apache-2.0, 1.8.0).
rangemap = "1.8"
# syncd's media type by extension (MIT, 2.0.5).
mime_guess = { version = "2", default-features = false }
# ferry-mountd's socket activation (Apache-2.0, 1.0.2; brings libc).
listenfd = "1"
# syncd's journal: SQLCipher built from source with a vendored OpenSSL, used unkeyed (quire's pinned line).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Dependencies keep no debug info (ferry's own crates keep line tables, `.cargo/config.toml`):
# it is most of what a test link carries.
[profile.dev.package."*"]
debug = false

# The crypto crates run optimised in the tests: syncd's tests open the keyring file backend, whose
# key derivation takes 100 000 rounds of PBKDF2. They are small, so the build cost is a few
# seconds, once.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.inout]
opt-level = 3

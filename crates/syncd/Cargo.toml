[package]
name = "syncd"
description = "ferry's sync daemon: org.quire.Sync1 over ferry-sync replicas. The library holds the datasets and their supervisors (run with ferry-engine's journal, engine, scheduler and hub), the bus objects and the Settings rows over the accounts accountd has (it reaches accounts, grants and relays only through porter-client); the binary resolves its paths and serves. Datasets: the contacts mirror (CardDAV and Google; calendars and tasks are callie's calendard), the storage folder (WebDAV, OneDrive and Google Drive app folders), the whole drives shown in Files, and Photos for an account whose Photos row is on."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferry-bus = { workspace = true }
ferry-drive = { workspace = true }
ferry-drive-fuse = { workspace = true }
# The engine, the PIM mirror and the vdir: libraries syncd runs its datasets with.
ferry-engine = { workspace = true }
ferry-pim-feed = { workspace = true }
ferry-pim-mirror = { workspace = true }
ferry-sync = { workspace = true }
ferry-vdir = { workspace = true }
storage-gdrive = { workspace = true }
storage-graph = { workspace = true }
storage-webdav = { workspace = true }
# Accounts, grants and relays: accountd's, reached through porter-client (the bus transport in
# the daemon). Nothing of porter's account stack is a dependency of syncd; the dev-dependencies
# host one in process for the tests.
porter-client = { workspace = true }
porter-client-dbus = { workspace = true }
# What syncd serves: the callers it judges and the bus objects (`Call`, `Details`, `BusTarget`).
porter-callers = { workspace = true, features = ["file"] }
porter-dbus = { workspace = true }
# Only `xdg`: the directories a daemon keeps its files under.
porter-daemon = { workspace = true }
# The vocabulary: needs, grants, ids, the parent window.
porter-core = { workspace = true }
porter-match = { workspace = true }
porter-capability = { workspace = true }
porter-wire = { workspace = true }
porter-ids = { workspace = true }
porter-fs = { workspace = true }
porter-http = { workspace = true }
porter-http-relay = { workspace = true }
ds-settings = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
mime_guess = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# `signal`: SIGTERM unmounts the drives before the process ends.
tokio = { workspace = true, features = ["signal"] }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
ds-settings = { workspace = true, features = ["testing"] }
ferry-engine = { workspace = true, features = ["testing"] }
base64 = { workspace = true }
tempfile = { workspace = true }
ferry-fake-graph = { workspace = true }
# The account service hosted in the test process, as the in-process transport of porter-client.
porter-client-inproc = { workspace = true, features = ["relays"] }
porter-fake = { workspace = true }
porter-sheet = { workspace = true }
porter-fake-servers = { workspace = true }
porter-http-reqwest = { workspace = true }
porter-provider = { workspace = true }
porter-secrets = { workspace = true, features = ["testing"] }
porter-service = { workspace = true }
porter-service-core = { workspace = true }
ferry-drive = { workspace = true, features = ["testing"] }
ferry-sync = { workspace = true, features = ["testing"] }
# The words the fake of Storage1 gives are held to the live ones (tests/it/fake_words.rs).
syncd-fakes = { workspace = true }
# A paused clock for the stop wait's timing test.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[features]
# Test builds only, never default and never in dist: `SYNCD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups, and `PORTER_SYSTEM_CALLERS=<file>` makes it read that file as
# the system caller table, because a jail cannot write /etc/porter. A release build ignores both
# variables. A test in tests/dist.rs fails if this feature is ever default, and
# check-boundary.sh checks it too.
test-proc-root = ["porter-callers/test-proc-root"]
# Serves `org.quire.Photos1.Picker` beside Sync1 (ferry-bus's feature of the same name declares
# it). Off by default: no Photos app ships in v1.
photos-picker = ["ferry-bus/photos-picker"]

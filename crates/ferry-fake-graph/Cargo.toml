[package]
name = "ferry-fake-graph"
description = "Test-only fake of the part of Microsoft Graph that ferry's replicas use: a drive (`/v1.0/me/drive`: items, content with ranges and redirects, simple and session uploads, delta, quota) and the calendars of `/v1.0/me/calendars`, behind a bearer token the fake issuer of porter-fake-servers minted. Never a dependency of a non-test crate."
